name: Continuous Integration

on: push

jobs:
  build_test:
    name: Build and Run Jest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Tests
        run: npm run test:coverage -- --runInBand
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v1
        with:
          flags: jest
  cypress:
    runs-on: ubuntu-latest
    container: cypress/browsers:node16.14.2-slim-chrome103-ff102
    strategy:
      # when one test fails, DO NOT cancel the other
      # containers, because this will kill Cypress processes
      # leaving the Dashboard hanging ...
      # https://github.com/cypress-io/github-action/issues/48
      fail-fast: false
      matrix:
        # run 3 copies of the current job in parallel
        containers: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v1
      # GitHub now runs cypress-io/github-action@v2 on Node 24, and there its own wait for the
      # dev server fails at once. So the server is started and waited on here, with the container's Node.
      - name: Install Dependencies
        run: npm ci
      - name: Start Dev Server
        # The output goes to a file, because nothing reads this step's output after the step ends.
        run: npm start > dev-server.log 2>&1 &
        env:
          # turn on code coverage for our npm start
          CODE_COVERAGE: true
      - name: Wait for Dev Server
        run: npx wait-on --timeout 180000 http-get://localhost:8080
      - name: Show Dev Server Log
        if: failure()
        run: cat dev-server.log
      - uses: cypress-io/github-action@v2
        with:
          install: false
          parallel: true
          record: true
        env:
          # pass the Dashboard record key as an environment variable
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # pass GitHub token to allow accurately detecting a build vs a re-run build
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_COVERAGE: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          flags: cypress
  s3-deploy:
    name: S3 Deploy
    needs:
      - build_test
      - cypress
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
      - name: Install Dependencies
        run: npm ci
        env:
          # skip installing cypress since it isn't needed for just building
          # This decreases the deploy time quite a bit
          CYPRESS_INSTALL_BINARY: 0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::612297603577:role/portal-report
          aws-region: us-east-1
      - uses: concord-consortium/s3-deploy-action@v1
        with:
          bucket: portal-report.concord.org
          noPrefix: true
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          deployRunUrl: https://portal-report.concord.org/__deployPath__/?portal-dashboard
          # Parameters to GHActions have to be strings, so a regular yaml array cannot
          # be used. Instead the `|` turns the following lines into a string
          topBranches: |
            ["master"]
